services:
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: nmd-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyStrongPass123!
      # 1. Увеличиваем память Java (было 1g, стало 2g)
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      # 2. Отключаем проверку bootstrap-чек (экономит память и CPU при старте)
      - "bootstrap.memory_lock=true"
      - "DISABLE_SECURITY_PLUGIN=true" # Отключаем SSL (ваш код использует http)
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  postgres:
    image: postgres:16-alpine
    container_name: nmd-postgres
    environment:
      POSTGRES_USER: memory_user
      POSTGRES_PASSWORD: memory_password
      POSTGRES_DB: memory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  opensearch_data:
  postgres_data:
  hf_cache: