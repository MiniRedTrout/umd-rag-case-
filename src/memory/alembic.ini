# Alembic for the agent's conversation-memory schema, and nothing else.
#
# Separate from py_gpn_keycloak/auth/mapping_accessors/pg/alembic.ini on
# purpose: that one migrates the Keycloak role-mapping schema from POSTGRES_*,
# this one migrates the conversation-memory schema (`memory_shared`) through
# the same connection. One database, two schema-local version tables, and two
# independent histories.
#
# Lives beside the code it migrates rather than at the repository root, for the
# same reason the role mapper's does: whatever ships `src/memory` ships this, so
# the local image's `COPY` and the compose mounts have one less thing to get
# wrong.
#
#   .venv/bin/alembic -c src/memory/alembic.ini upgrade head
#   .venv/bin/alembic -c src/memory/alembic.ini downgrade base

[alembic]
script_location = %(here)s/migrations
# The repository root, so ``env.py`` can import ``src.memory.*``. Spelled
# relative to this file rather than as a bare ``../..`` so it holds wherever
# the command is run from.
prepend_sys_path = %(here)s/../..
path_separator = os

# Left unset here. env.py builds the URL from POSTGRES_*, so a password
# never has to sit in a file that is committed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
