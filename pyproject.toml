[tool.poetry]
name = "case-md"
version = "0.1.0"
description = "RAG chat over a corpus of plain-text documents"
authors = []
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
loguru = "^0.7.2"
langchain-core = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-text-splitters = "^0.3.0"
langgraph = "^0.2.0"
openai = "^1.50.0"
httpx = "^0.27.0"
opensearch-py = "^2.7.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"
asyncpg = "^0.30.0"
tiktoken = "^0.8.0"
nltk = "^3.9.0"
scipy = "^1.14.0"
pyyaml = "^6.0.0"
jinja2 = "^3.1.0"
python-dotenv = "^1.0.0"
openpyxl = "^3.1.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"